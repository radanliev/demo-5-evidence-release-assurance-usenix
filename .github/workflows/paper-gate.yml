name: paper gate

# Deterministic USENIX Security 2027 compliance + scientific-consistency gate.
# Fails the build on BLOCKER/MAJOR so a regression cannot reach a submission branch.

on:
  push:
    paths: ['docs/**', 'results/**', 'benchmark/**', 'eval/**', '.paperloop/**']
  pull_request:
    paths: ['docs/**', 'results/**', 'benchmark/**', 'eval/**', '.paperloop/**']
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to 40-char SHAs: demo-1's supply-chain triage rejects
      # floating tags, and these repos are about supply-chain integrity.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install gate dependencies
        run: pip install pyyaml pdfplumber pypdf

      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-science texlive-publishers latexmk poppler-utils

      - name: Build the manuscript
        continue-on-error: true
        run: python3 scripts/generate_paper_pdf.py

      - name: Run gates
        id: gates
        # Fails on BLOCKER only. MAJOR/MINOR are reported in the summary but do
        # not fail the build: these manuscripts have a known backlog, and a
        # check that is always red teaches everyone to ignore it.
        run: python3 .paperloop/run_gates.py --render --fail-on blocker

      - name: Publish report
        if: always()
        run: |
          echo "## Paper gate — USENIX Security 2027" >> $GITHUB_STEP_SUMMARY
          cat .paperloop/state/FINDINGS.md >> $GITHUB_STEP_SUMMARY || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: paper-gate-report
          path: |
            .paperloop/state/FINDINGS.md
            .paperloop/state/findings.json
            .paperloop/state/pages/
          if-no-files-found: ignore
