name: paper gate

# Deterministic USENIX Security 2027 compliance + scientific-consistency gate.
# Fails the build on BLOCKER/MAJOR so a regression cannot reach a submission branch.

on:
  push:
    paths: ['docs/**', 'results/**', 'benchmark/**', 'eval/**', '.paperloop/**']
  pull_request:
    paths: ['docs/**', 'results/**', 'benchmark/**', 'eval/**', '.paperloop/**']
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gate dependencies
        run: pip install pyyaml pdfplumber pypdf

      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-science texlive-publishers latexmk poppler-utils

      - name: Build the manuscript
        continue-on-error: true
        run: python3 scripts/generate_paper_pdf.py

      - name: Run gates
        id: gates
        run: python3 .paperloop/run_gates.py --render

      - name: Publish report
        if: always()
        run: |
          echo "## Paper gate — USENIX Security 2027" >> $GITHUB_STEP_SUMMARY
          cat .paperloop/state/FINDINGS.md >> $GITHUB_STEP_SUMMARY || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-gate-report
          path: |
            .paperloop/state/FINDINGS.md
            .paperloop/state/findings.json
            .paperloop/state/pages/
          if-no-files-found: ignore
