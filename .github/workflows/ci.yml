name: USENIX Security Release Assurance CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pytest & Release Gate Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # assurance/crypto.py imports `cryptography`; without it every
          # test errors at collection and the job fails in seconds.
          pip install pytest pyyaml cryptography

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Verify Release Gate
        run: |
          python scripts/verify_release_gate.py
