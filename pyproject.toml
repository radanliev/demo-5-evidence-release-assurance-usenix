[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-5-evidence-release-assurance-usenix"
version = "0.1.0"
description = "USENIX Security evidence-backed release assurance and deployment gate harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.5.0",
    "cryptography>=42.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
