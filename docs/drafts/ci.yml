name: USENIX Security Release Assurance CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security:
    name: Security Static Analysis (semgrep + bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install bandit semgrep pyyaml cryptography

      # Custom rule: verifiers must not trust key material from the payload
      # being verified (regression guard for the 98fc6f1 auth-bypass fix).
      # Direct semgrep (not the deprecated semgrep-action@v1, whose old
      # bundled engine mis-evaluated the nosemgrep annotation and failed).
      - name: Custom key-trust rules (fail on hit)
        run: semgrep scan --config semgrep/ --error assurance/ scripts/

      - name: Bandit (report; currently no medium/high — keep it that way)
        run: bandit -r assurance/ scripts/ -f json -o bandit-report.json || true

      - name: Publish bandit report
        if: always()
        run: |
          if [ -f bandit-report.json ]; then
            cat bandit-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no bandit report produced" >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: Run Pytest & Release Gate Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # assurance/crypto.py imports `cryptography`; without it every
          # test errors at collection and the job fails in seconds.
          # dev extras (pytest, bandit, ...) declared in pyproject.toml
          pip install pyyaml cryptography ".[dev]"

      # The five container-isolation tests need the witness image, which is a
      # build product of this repository, not a registry pull. Without this
      # step the ubuntu-latest runner has a Docker daemon but no image, and
      # `docker run` fails on a pull attempt (the tests now skip in that case;
      # here we want them to RUN, because the paper claims the properties).
      - name: Build witness container image
        run: docker build -f specimens/witness.Dockerfile -t eviassure-witness:latest .

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Verify Release Gate
        run: |
          python scripts/verify_release_gate.py
